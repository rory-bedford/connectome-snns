# `uv run --no-sync pre-commit install` sets up both stages: ruff on every commit, and the full
# test suite (GPU tests included when CUDA is available) before every push.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0  # keep in step with the dev group's ruff
    hooks:
      - id: ruff-check
        name: Ruff Lint
        args: [--fix]
      - id: ruff-format
        name: Ruff Format
  - repo: local
    hooks:
      - id: pytest
        name: Test suite
        # --no-sync: test the environment as it is, never re-resolve it mid-push.
        entry: uv run --no-sync pytest -q -x
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
