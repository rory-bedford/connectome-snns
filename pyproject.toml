[project]
name = "connectome-snns"
version = "0.1.0"
description = "Research code modelling connectome-constrained neural network dynamics with PyTorch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask>=2025.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.0,<2.3",
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
    "cma>=4.0.0",
    "wandb>=0.22.3",
    "zarr>=3.1.3",
    "scikit-learn>=1.8.0",
    "torchnmf>=0.3.5",
    "ipywidgets>=8.1.7",
    "widgetsnbextension>=4.0.14",
    "triton==3.4.0",
    "h5py>=3.16.0",
]

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

# Single namespaced package under src/ — `connectome_snns` and its subpackages.
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
cpu = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]
cu129 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "cuml-cu12==26.2.*",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
ignore = ["E741"]
